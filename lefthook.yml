min_version: 2.2.0

pre-commit:
  parallel: true
  jobs:
    - name: fix+format
      glob: "*.py"
      group:
        jobs:
          - run: uv run ruff check --fix {staged_files}
            stage_fixed: true
          - run: uv run ruff format {staged_files}
            stage_fixed: true
    - name: lint-imports
      glob: "*.py"
      run: uv run lint-imports
    - name: test
      glob: "*.py"
      run: uv run pytest -q

min_version: 2.2.0

pre-commit:
  parallel: true
  jobs:
    - name: fix+format
      glob: "*.py"
      group:
        jobs:
          - run: uv run ruff check --fix {staged_files}
            stage_fixed: true
          - run: uv run ruff format {staged_files}
            stage_fixed: true
    - name: lint-imports
      glob: "*.py"
      run: uv run lint-imports
    - name: pyrefly
      glob: "*.py"
      run: uv run pyrefly check
    - name: test
      glob: "*.py"
      run: uv run pytest -q
    - name: web-fix+format
      root: web/
      glob: "*.{ts,js,mjs,cjs,svelte,css,html,json}"
      group:
        jobs:
          - run: vp lint --fix --no-error-on-unmatched-pattern {staged_files}
            stage_fixed: true
          - run: vp fmt --write --no-error-on-unmatched-pattern {staged_files}
            stage_fixed: true
    - name: web-svelte-check
      root: web/
      glob: "*.{ts,svelte,json}"
      run: vp exec svelte-check --tsconfig ./tsconfig.json
